# This fragment goes in the BIRD configuration of the LB Pod.
# BGP peers/export policy remain site-specific; export only these VIP routes.
protocol static tc_vips4 {
    disabled;
    ipv4;
    route 192.0.2.10/32 blackhole;
    route 192.0.2.11/32 blackhole;
}
protocol static tc_vips6 {
    disabled;
    ipv6;
    route 2001:db8:1::a/128 blackhole;
    route 2001:db8:1::b/128 blackhole;
}
